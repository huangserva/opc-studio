<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gmail 接入</title><link rel="stylesheet" href="/gmail.css"></head><body><main><nav><a href="/knowledge.html">返回知识库</a></nav><h1>Gmail 收信</h1><p>邮件仅在本机私有索引查看；附件只保存元数据，不会下载附件或发送邮件。</p><button id="unlock">本人在本机查看与管理</button><p id="notice" role="status"></p><section><h2>连接</h2><p>准备好连接与同步后，再由您登录 Google 授权。本期只申请收信权限。</p><label>Desktop 客户端 JSON <input id="client" type="file" accept="application/json,.json"></label><label><input id="fallback" type="checkbox">明确改用仓库外私有文件（未加密；默认使用 Keychain）</label><button id="import">导入客户端</button><label>预期账号（首次连接必填）<input id="account" type="email" autocomplete="off"></label><button id="connect">连接 / 重新授权</button><a id="authorize" hidden target="_blank" rel="noreferrer noopener">前往 Google 授权</a><button id="disconnect">断开（保留缓存）</button></section><section><h2>同步</h2><label>回填天数<input id="days" type="number" min="1" max="365" value="30"></label><label>建议频率<select id="interval"><option value="60">60 分钟</option><option value="30">30 分钟</option></select></label><label>标签 ID（逗号分隔，任一匹配）<input id="labels"></label><button id="configure">保存范围</button><p>频率供统一运行器使用，本期尚未注册正式排程。</p><button id="sync">开始 / 继续同步</button><button id="pause">暂停</button><button id="resume">恢复</button><pre id="progress"></pre></section><section><h2>本机私有邮件</h2><label>检索<input id="query"></label><button id="search">私有搜索</button><p id="count"></p><div id="results"></div><article id="reader" hidden><h3 id="subject"></h3><p id="scope"></p><pre id="body"></pre><ul id="attachments"></ul></article></section></main><script src="/gmail.js" defer></script></body></html>
