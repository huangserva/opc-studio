<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>素材库 · 内容工作台</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/today.css"><link rel="stylesheet" href="/library.css"></head>
<body><aside class="workspace-sidebar"><a class="brand" href="/today.html">内容工作台</a><nav id="workspace-nav" aria-label="工作台栏目"></nav></aside>
<main class="today-main"><header class="today-status"><h1 class="page-title">素材库</h1><span id="total" aria-live="polite"></span><button id="trash" type="button">回收站</button></header>
<div class="library-tabs" role="tablist" aria-label="素材与资料"><button id="mine" role="tab" aria-selected="true" type="button">我的素材</button><button id="research" role="tab" aria-selected="false" type="button">资料检索</button><span id="tab-hint">存下来的内容，随时拿去写</span></div>
<form id="filters" class="filters" role="search"><input id="q" type="search" aria-label="搜索素材或资料" placeholder="搜索标题、正文、收藏理由"><button type="submit">搜索</button><select id="source" aria-label="来源"><option value="">全部来源</option></select><select id="kind" aria-label="类型"><option value="">全部类型</option><option value="article">文章</option><option value="post">帖子</option><option value="video">视频</option><option value="card">提示词卡</option><option value="repo">代码仓库</option></select><select id="tag" aria-label="标签"><option value="">全部标签</option></select><select id="status" aria-label="状态"><option value="">全部状态</option><option value="kept">已收藏</option><option value="used">已拿去写</option><option value="new">未处理</option></select></form>
<div id="layout" class="list-reader"><section id="item-list" class="item-list" aria-label="素材列表" aria-busy="true"><div class="skeleton"></div><div class="skeleton"></div></section><div id="divider" class="divider" role="separator" aria-orientation="vertical" aria-label="调整左右分栏" tabindex="0"></div><section id="reader" class="reader" aria-label="全文阅读器" tabindex="-1"><div class="reader-empty">点左侧条目查看全文 · J / K 切换</div></section></div><footer><button id="trash-bottom" type="button">回收站</button><span id="page-notice" role="status"></span></footer>
</main><script src="/workspace-nav.js"></script><script type="module" src="/library.js"></script></body></html>
