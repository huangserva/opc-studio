<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>上传到大后方 · 知识库</title><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/knowledge-upload.css"><script src="/knowledge-upload.js" defer></script></head>
<body><main><a href="/knowledge.html">← 返回知识库</a><h1>上传到大后方</h1><p>选择本机文案与作品、外部参考文章，以及已回本机库的复盘笔记和发布观察。正文、来源和内部标签一并保留；已上传且内容相同的会跳过。</p><p>文案与外部参考沿用「隐私-公开」；复盘与发布观察使用「隐私-内部＋类型-知识」。普通手动笔记、未回库复盘和原始指标快照不在上传范围。</p><div class="controls"><label>资料类型 <select id="upload-source"><option value="">全部可上传资料</option><option value="reviews">复盘笔记与发布观察</option><option value="articles">文案与作品</option><option value="external-references">外部参考</option></select></label><label><input id="pending-only" type="checkbox" checked> 只看未上传</label><button id="select-visible">选择当前列表（最多 50 篇）</button><button id="clear-selection">取消选择</button><button id="upload" disabled>上传所选（0）</button><button id="refresh">刷新</button></div><p id="status" role="status" aria-live="polite">正在读取本机清单…</p><div id="documents" aria-busy="true"></div></main></body></html>
