<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发布复盘 · 内容工作台</title><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/today.css"><link rel="stylesheet" href="/publish.css"></head>
<body><aside class="workspace-sidebar"><a class="brand" href="/today.html">内容工作台</a><nav id="workspace-nav" aria-label="工作台栏目"></nav></aside>
<main class="today-main"><header class="today-status"><h1 class="page-title">发布复盘</h1><span id="total" aria-live="polite"></span><a href="/x-official.html">X 发布 / 账号设置</a></header>
<section class="grok-overview" aria-label="近7天帖子数据"><h2>X 帖子 <span class="muted">@servasyy_ai</span></h2><div id="x-week" class="x-week" aria-live="polite">正在读取 Grok 帖子…</div><p id="x-notice" class="muted"></p><details class="capture-days"><summary>查看最近30天抓取情况</summary><ul id="capture-days"></ul></details></section>
<section class="x-layout" aria-label="X帖子与增长曲线"><div class="x-list-column"><div id="x-posts-list" aria-busy="true"></div><details id="x-replies"><summary>回复（0）</summary><div id="x-replies-list"></div></details><details id="x-other" hidden><summary>其他类型</summary><div id="x-other-list"></div></details></div><section id="x-detail" class="x-detail" aria-label="X帖子详情" tabindex="-1"><p class="review-empty">选择帖子查看增长曲线</p></section></section>
<section id="studio-grok-review" class="grok-review studio-grok-review" aria-label="Grok Bot 每日复盘（工作台）"><h2>Grok Bot 每日复盘（工作台）</h2><p>正在读取…</p></section>
<section class="grok-reviews"><section id="daily-review" class="grok-review" aria-label="Grok 每日复盘（帖子）"><h2>Grok 每日复盘（帖子）</h2><p>正在读取…</p></section><section id="weekly-review" class="grok-review" aria-label="每周复盘"><h2>每周复盘</h2><p>正在读取…</p></section></section>
<details class="legacy-publishing" id="legacy-publishing"><summary>工作台登记的发布 <span id="legacy-total"></span></summary>
<section class="review-toolbar"><div class="week-stat"><strong id="week-count">—</strong><span>近7天登记</span></div><div class="week-stat"><strong id="week-items">—</strong><span>来源素材</span></div><div class="sync-controls"><button id="sync" type="button">同步旧版 X 缓存</button><small>只更新工作台登记；Grok 数据由 Grok 抓取</small><span id="sync-status" role="status"></span></div></section>
<p class="review-notice" id="notice"></p>
<div class="review-layout"><section id="published-list" aria-label="已发布列表" aria-busy="true"><p>正在读取发布记录…</p></section><section id="review-detail" class="reader" aria-label="发布详情" tabindex="-1"><div class="reader-empty">选择作品，查看数据快照与复盘备注</div></section></div></details>
</main><script src="/workspace-nav.js"></script><script type="module" src="/publish.js"></script></body></html>
