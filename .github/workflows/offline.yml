name: Offline core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pi-runtime/package-lock.json
      - name: Install synthetic media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install locked Node dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
          npm ci --prefix pi-runtime --ignore-scripts
          node pi-runtime/prepare.mjs
      - name: Verify portable offline scope
        run: python scripts/check_offline.py
      - name: Verify empty local HTTP library
        run: python scripts/smoke_local.py
